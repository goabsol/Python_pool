[build-system]
requires = [
  "setuptools>=64",
  "wheel",               # for bdist package distribution
]

build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project]
name = "pyflem"
dynamic = ["version"]
description = "A lazy python package"
authors = [{ name = "goabsol" }, { email = "arhallab@student.1337.ma" }]
maintainers = [{ name = "goabsol" }, { email = "arhallab@student.1337.ma" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
]
[project.urls]
Homepage = "https//github.com/goabsol/Python_00/ex09"
